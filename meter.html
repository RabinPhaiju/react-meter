<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Water Meter Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="counter-container" id="counter">
    <div class="digit-wrapper" data-role="hundreds"></div>
    <div class="digit-wrapper" data-role="tens"></div>
    <div class="digit-wrapper" data-role="units"></div>
    <div class="decimal-point">.</div>
    <div class="digit-wrapper" data-role="decimal"></div>
  </div>

  <div class="controls">
    <button id="dec">0.1</button>
    <button id="inc">+0.1</button>
    <button id="dec05">−0.5</button>
    <button id="inc05">+0.5</button>
  </div>

  <script>
    const DIGIT_REPEAT = 20;
    const DIGIT_VALUES = 10;
    const STEP = 0.1;
    const MIN_VALUE = 0;
    const MAX_VALUE = 999.999;

    const digitHeight = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue("--digit-height")) || 80;

    const counter = document.getElementById('counter');
    const wrappers = Array.from(counter.querySelectorAll('.digit-wrapper'));

    // Pre-build digit strips to avoid manual markup duplication.
    const digitStrips = wrappers.map(wrapper => {
      const strip = document.createElement('div');
      strip.className = 'digit-strip';
      for (let repeat = 0; repeat < DIGIT_REPEAT; repeat += 1) {
        for (let digit = 0; digit < DIGIT_VALUES; digit += 1) {
          const cell = document.createElement('div');
          cell.className = 'digit';
          cell.textContent = digit;
          strip.appendChild(cell);
        }
      }
      wrapper.appendChild(strip);
      return strip;
    });

    let value = 7.53;

    const clamp = (val, min, max) => Math.min(max, Math.max(min, val));

    let decimalOffset = 0;
    let previousFractional = 0;
    let hundredsOffset = 0;
    let tensOffset = 0;
    let unitsOffset = 0;
    let previousDigits = [0, 0, 0];

    function updateCounter() {
      const safeValue = clamp(value, MIN_VALUE, MAX_VALUE);
      const intPart = Math.floor(safeValue);
      const fractional = safeValue - intPart;

      if (fractional < previousFractional) {
        decimalOffset += 10;
      }
      previousFractional = fractional;

      const digits = [
        Math.floor(intPart / 100) % 10,
        Math.floor(intPart / 10) % 10,
        intPart % 10
      ];

      for (let i = 2; i >= 0; i--) {
        if (digits[i] < previousDigits[i]) {
          if (i === 0) hundredsOffset += 10;
          else if (i === 1) tensOffset += 10;
          else unitsOffset += 10;
        }
      }
      previousDigits = [...digits];

      digitStrips.slice(0, 3).forEach((strip, index) => {
        let offset = 0;
        if (index === 0) offset = hundredsOffset;
        else if (index === 1) offset = tensOffset;
        else offset = unitsOffset;
        strip.style.transform = `translateY(${-(digits[index] + offset) * digitHeight}px)`;
      });

      const decimalPosition = fractional * 10 + decimalOffset;
      digitStrips[3].style.transform = `translateY(${-decimalPosition * digitHeight}px)`;
    }

    document.getElementById('inc').addEventListener('click', () => {
      value = Number((value + STEP).toFixed(3));
      updateCounter();
    });

    document.getElementById('dec').addEventListener('click', () => {
      value = Number((value - STEP).toFixed(3));
      updateCounter();
    });

    document.getElementById('inc05').addEventListener('click', () => {
      value = Number((value + 10.4).toFixed(3));
      updateCounter();
    });

    document.getElementById('dec05').addEventListener('click', () => {
      value = Number((value - 0.4).toFixed(3));
      updateCounter();
    });

    updateCounter();
  </script>
</body>
</html>
